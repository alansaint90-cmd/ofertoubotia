services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ofertou
      POSTGRES_USER: ofertou
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente}
    ports:
      - "5432:5432"
    volumes:
      - ofertou_pgdata:/var/lib/postgresql/data
volumes:
  ofertou_pgdata:
